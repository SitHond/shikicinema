<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShikiRIP Cinema</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0d1117; color: #e6edf3;
    font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
    padding: 24px;
  }
  .card {
    background: #161b22; border: 1px solid #21262d;
    border-radius: 12px; padding: 32px 28px; max-width: 460px; width: 100%;
    text-align: center;
  }
  .logo { font-size: 0.8rem; font-weight: 600; color: #636e7b; margin-bottom: 24px; letter-spacing: .04em; }
  .logo span { color: #e6edf3; }
  .icon { font-size: 2.5rem; margin-bottom: 16px; }
  h1 { font-size: 1.1rem; font-weight: 600; margin-bottom: 10px; }
  .domain {
    display: inline-block; background: #1c2230; border: 1px solid #2d3748;
    border-radius: 6px; padding: 6px 14px; font-family: monospace; font-size: 0.9rem;
    color: #79c0ff; margin: 12px 0 20px;
  }
  .domain-list {
    display: flex; flex-direction: column; gap: 6px;
    margin: 12px 0 20px; text-align: left;
  }
  .domain-list .domain { display: block; margin: 0; width: 100%; }
  p { font-size: 0.85rem; color: #9eaab8; line-height: 1.6; margin-bottom: 24px; }
  button {
    background: #0c2417; border: 1px solid #2da44e; color: #2da44e;
    border-radius: 8px; padding: 10px 28px; font: inherit; font-size: 0.9rem;
    font-weight: 600; cursor: pointer; transition: background .15s; width: 100%;
  }
  button:hover { background: #0e2e1c; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { margin-top: 16px; font-size: 0.82rem; min-height: 20px; }
  .status.ok { color: #2da44e; }
  .status.err { color: #f85149; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">SHIKI<span>RIP</span> Cinema</div>
  <div class="icon">🔐</div>
  <h1 id="title">Разрешите доступ к Shikimori</h1>
  <div id="domain-wrap"></div>
  <p id="desc"></p>
  <button id="btn-grant">Разрешить доступ</button>
  <div class="status" id="status"></div>
</div>
<script src="permission-grant.js"></script>
</body>
</html>
