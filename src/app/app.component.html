<ion-app class="root" [class.root--embed]="isEmbedMode()">
    @if (!isEmbedMode()) {
        <app-header class="root__header"></app-header>
    }
    <ion-router-outlet class="root__content"></ion-router-outlet>
    @if (!isEmbedMode()) {
        <footer class="root__footer">
            <span class="root__footer-name">ShikiRIP Cinema</span>
            <span class="root__footer-version">v{{ version }}</span>
        </footer>
    }
</ion-app>
